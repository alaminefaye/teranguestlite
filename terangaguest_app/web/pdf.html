<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <title>Document PDF</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #031b3d;
      --panel: #07244d;
      --accent: #c7a548;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.75);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 60px;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
      background: var(--panel);
      border-bottom: 1px solid rgba(199, 165, 72, 0.25);
      color: var(--text);
      flex-shrink: 0;
    }

    .back-button {
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--accent);
      color: #111111;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .title-wrap {
      min-width: 0;
      flex: 1;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .viewer-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #f3f4f6;
    }

    .loader,
    .error {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #f3f4f6;
      color: #111827;
      font-size: 15px;
      line-height: 1.5;
    }

    .error {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .secondary-button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="back-button" id="backButton" type="button">
      Retour a l'application
    </button>
    <div class="title-wrap">
      <div class="title" id="title">Document PDF</div>
      <div class="status" id="status">Chargement du document...</div>
    </div>
  </div>

  <div class="viewer-wrap">
    <div class="loader" id="loader">Chargement du PDF...</div>
    <div class="error" id="errorBox">
      <div>Impossible d'afficher le PDF ici.</div>
      <button class="secondary-button" id="openDirectButton" type="button">
        Ouvrir le PDF directement
      </button>
    </div>
    <iframe id="pdfFrame" title="PDF"></iframe>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const fileUrl = params.get('file') || '';
      const title = params.get('title') || 'Document PDF';
      const returnUrl = params.get('return') || '/client/';

      const titleNode = document.getElementById('title');
      const statusNode = document.getElementById('status');
      const loaderNode = document.getElementById('loader');
      const errorNode = document.getElementById('errorBox');
      const frameNode = document.getElementById('pdfFrame');
      const backButton = document.getElementById('backButton');
      const openDirectButton = document.getElementById('openDirectButton');

      titleNode.textContent = title;

      function goBackToApp() {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        window.location.href = returnUrl;
      }

      function showError() {
        loaderNode.style.display = 'none';
        errorNode.style.display = 'flex';
        statusNode.textContent = 'Le chargement a echoue.';
      }

      backButton.addEventListener('click', goBackToApp);
      openDirectButton.addEventListener('click', function () {
        if (fileUrl) {
          window.location.href = fileUrl;
        }
      });

      if (!fileUrl) {
        showError();
        return;
      }

      const timeoutId = window.setTimeout(showError, 12000);

      frameNode.addEventListener('load', function () {
        window.clearTimeout(timeoutId);
        loaderNode.style.display = 'none';
        errorNode.style.display = 'none';
        statusNode.textContent = 'Document charge.';
      });

      frameNode.addEventListener('error', function () {
        window.clearTimeout(timeoutId);
        showError();
      });

      frameNode.src = fileUrl;
    })();
  </script>
</body>
</html>
